<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login – SkyRoute</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">

      <div class="login-brand">
        <em>Sky</em><span>Route</span>
      </div>
      <div class="login-sub">
        Admin Portal · Secure Access
      </div>

      <div class="login-msg" id="login-msg"></div>

      <div class="form-group" style="margin-bottom:16px">
        <label class="login-label">Username</label>
        <input type="text" class="login-input" id="admin-username"
          placeholder="admin" autocomplete="username">
      </div>

      <div class="form-group" style="margin-bottom:20px">
        <label class="login-label">Password</label>
        <div class="pass-wrap">
          <input type="password" class="login-input" id="admin-password"
            placeholder="••••••••" autocomplete="current-password" style="padding-right:44px">
          <button class="pass-toggle" id="pass-toggle" type="button" onclick="togglePass()">👁</button>
        </div>
      </div>

      <div class="login-err" id="login-err"></div>

      <button class="login-btn" id="admin-login-btn" onclick="adminLogin()">
        Sign In
      </button>

      <div style="text-align:center;margin-top:20px">
        <a href="index.html" style="font-size:12px;color:var(--muted);transition:color var(--transition)"
          onmouseover="this.style.color='var(--gold)'" onmouseout="this.style.color='var(--muted)'">
          ← Back to SkyRoute
        </a>
      </div>
    </div>
  </div>

  <script>
    const API = 'http://localhost:5000/api';

    document.documentElement.setAttribute('data-theme', 'dark');

    if (localStorage.getItem('skyroute_admin_token')) {
      window.location.href = 'admin.html';
    }

    function showMsg(type, msg) {
      const el = document.getElementById('login-msg');
      el.className = `login-msg ${type}`;
      el.textContent = msg;
    }

    function showErr(msg) {
      document.getElementById('login-err').textContent = msg;
    }

    function togglePass() {
      const inp = document.getElementById('admin-password');
      inp.type  = inp.type === 'password' ? 'text' : 'password';
    }

    async function adminLogin() {
      const btn      = document.getElementById('admin-login-btn');
      const username = document.getElementById('admin-username').value.trim();
      const password = document.getElementById('admin-password').value;

      document.getElementById('login-err').textContent = '';
      document.getElementById('login-msg').className   = 'login-msg';

      if (!username || !password) {
        showErr('Please enter username and password.');
        return;
      }

      btn.disabled  = true;
      btn.innerHTML = '<span class="spinner"></span>';

      try {
        const res  = await fetch(`${API}/admin/auth/login`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ username, password }),
        });
        const data = await res.json();

        if (!res.ok) {
          showErr(data.error || 'Invalid credentials.');
          return;
        }

        localStorage.setItem('skyroute_admin_token', data.token);
        localStorage.setItem('skyroute_admin_user',  JSON.stringify(data.admin));
        showMsg('success', 'Access granted. Redirecting…');
        setTimeout(() => { window.location.href = 'admin.html'; }, 700);
      } catch {
        showErr('Could not reach backend. Make sure the server is running on port 5000.');
      } finally {
        btn.disabled  = false;
        btn.innerHTML = 'Sign In';
      }
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') adminLogin(); });
  </script>
</body>
</html>
